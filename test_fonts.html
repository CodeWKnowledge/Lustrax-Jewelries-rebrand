<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'ReferenceFont';
  src: url('./frontend/src/assets/fonts/reference.woff2') format('woff2');
}
@font-face {
  font-family: 'Playfair Display';
  src: url('./frontend/src/assets/fonts/Playfair_Display/PlayfairDisplay-VariableFont_wght.ttf') format('truetype');
}
@font-face {
  font-family: 'DM Sans';
  src: url('./frontend/src/assets/fonts/DM_Sans/DMSans-Variable.woff2') format('woff2');
}
.box { margin: 20px; padding: 15px; border: 1px solid #ccc; }
.ref { font-family: 'ReferenceFont'; font-size: 32px; }
.playfair { font-family: 'Playfair Display'; font-size: 32px; }
.dmsans { font-family: 'DM Sans'; font-size: 32px; }
</style>
</head>
<body>
<div class="box">
  <h3>ReferenceFont</h3>
  <div class="ref">Crown Royal Collection - Craft & Rare Luxury Jewelry (Cc, Rr)</div>
</div>
<div class="box">
  <h3>Playfair Display</h3>
  <div class="playfair">Crown Royal Collection - Craft & Rare Luxury Jewelry (Cc, Rr)</div>
</div>
<div class="box">
  <h3>DM Sans</h3>
  <div class="dmsans">Crown Royal Collection - Craft & Rare Luxury Jewelry (Cc, Rr)</div>
</div>
</body>
</html>
